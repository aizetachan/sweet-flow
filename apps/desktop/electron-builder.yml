# Unsigned builds for the validation phase (docs/ARCHITECTURE.md §7.2).
# Signing is added later (Developer ID + notarization / Trusted Signing)
# without touching the app: fill in identity / signing options here.
appId: com.sweetflow.app
productName: Sweetflow
copyright: Copyright © Sweetflow
directories:
  output: release
  buildResources: build
# Main, preload, mirror and the renderer are bundled into out/ by
# scripts/build.mjs, so the package ships no node_modules at all.
files:
  - out/**
  - "!out/**/*.map"
  - package.json
asar: true
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
publish:
  provider: github
  owner: aizetachan
  repo: sweet-flow
  releaseType: release
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: universal
  identity: null
  hardenedRuntime: false
  notarize: false
dmg:
  sign: false
  # The window that opens on the .dmg (docs/DEVELOPMENT.md «Imágenes del instalador»):
  # 540×380, the app on the left and Applications on the right (x, y: icon centres).
  # Its background, if there is one: build/background.png (+ build/background@2x.png).
  window:
    width: 540
    height: 380
  iconSize: 112
  contents:
    - x: 140
      y: 170
    - x: 400
      y: 170
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch: x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
