# Unsigned builds for the validation phase (docs/ARCHITECTURE.md §7.2).
# Signing is added later (Developer ID + notarization / Trusted Signing)
# without touching the app: fill in identity / signing options here.
appId: com.sweetflow.app
productName: Sweetflow
copyright: Copyright © Sweetflow
directories:
  output: release
  buildResources: build
# Main, preload, mirror and the renderer are bundled into out/ by
# scripts/build.mjs, so the package ships no node_modules at all.
files:
  - out/**
  - "!out/**/*.map"
  - package.json
asar: true
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
publish:
  provider: github
  owner: aizetachan
  repo: sweet-flow
  releaseType: release
mac:
  category: public.app-category.video
  # App icon (build/icon.png, 1024 px, its rounded square already drawn).
  icon: build/icon.png
  target:
    - target: dmg
      arch: universal
  identity: null
  hardenedRuntime: false
  notarize: false
dmg:
  sign: false
  # The window that opens on the .dmg (docs/DEVELOPMENT.md «Imágenes del instalador»):
  # 540×380, the app on the left and Applications on the right (x, y: icon centres). High
  # in the window: Finder's bars can cover its bottom ~60 pt. A light background, since
  # Finder writes the icons' names in black.
  # Background (build/background@2x.png for Retina) and the disk's own icon: the floppy.
  background: build/background.png
  icon: build/dmg-icon.icns
  window:
    width: 540
    height: 380
  iconSize: 112
  contents:
    - x: 140
      y: 140
    - x: 400
      y: 140
      type: link
      path: /Applications
win:
  icon: build/icon-win.png
  target:
    - target: nsis
      arch: x64
  signAndEditExecutable: false
nsis:
  # The setup program's icon: the floppy.
  installerIcon: build/installer-icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
