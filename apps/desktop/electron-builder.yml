# Unsigned builds for the validation phase (docs/ARCHITECTURE.md §7.2).
# Signing is added later (Developer ID + notarization / Trusted Signing)
# without touching the app: fill in identity / signing options here.
appId: com.sweetflow.app
productName: Sweetflow
copyright: Copyright © Sweetflow
directories:
  output: release
  buildResources: build
# Main, preload, mirror and the renderer are bundled into out/ by
# scripts/build.mjs, so the package ships no node_modules at all.
files:
  - out/**
  - "!out/**/*.map"
  - package.json
asar: true
# macOS: the stable development signature, when this Mac has the certificate (see mac.identity).
afterSign: scripts/sign.cjs
# The terminal's native module and its helper must be real files on disk.
asarUnpack:
  - out/node_modules/node-pty/**
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
publish:
  provider: github
  owner: aizetachan
  repo: sweet-flow
  releaseType: release
mac:
  category: public.app-category.video
  # App icon (build/icon.png, 1024 px, its rounded square already drawn).
  icon: build/icon.png
  target:
    - target: dmg
      arch: universal
  # The terminal's binaries already come one per architecture (prebuilds/darwin-arm64 and
  # darwin-x64), the same in both halves of the universal app: kept as they are.
  x64ArchFiles: "**/node_modules/node-pty/prebuilds/**"
  # Ad-hoc signature ("-"): free, no certificate. It gives the app an identity
  # (com.sweetflow.app) so macOS remembers the access the user allows to the team folder
  # (Escritorio, Documentos, Dropbox…) and asks once instead of on every file it reads.
  # But each new build is a new identity for macOS, so it asks again after every update:
  # scripts/sign.cjs (afterSign, below) re-signs the app with the development certificate
  # «Sweetflow Dev» when this Mac has it (scripts/dev-cert.sh), one identity for all builds.
  identity: "-"
  hardenedRuntime: false
  # The text of macOS' permission prompts.
  extendInfo:
    NSDesktopFolderUsageDescription: Sweetflow guarda y lee las producciones en la carpeta del equipo.
    NSDocumentsFolderUsageDescription: Sweetflow guarda y lee las producciones en la carpeta del equipo.
    NSDownloadsFolderUsageDescription: Sweetflow guarda y lee las producciones en la carpeta del equipo.
    NSRemovableVolumesUsageDescription: Sweetflow guarda y lee las producciones en la carpeta del equipo.
    NSNetworkVolumesUsageDescription: Sweetflow guarda y lee las producciones en la carpeta del equipo.
    NSFileProviderDomainUsageDescription: Sweetflow guarda y lee las producciones en la carpeta del equipo (Dropbox, Google Drive).
  notarize: false
dmg:
  sign: false
  # Name of the disk (and of its window) when the .dmg is opened.
  title: "Sweetflow - Contanimation_edition 0.1"
  # The window that opens on the .dmg (docs/DEVELOPMENT.md «Imágenes del instalador»):
  # 540×380, the app on the left and Applications on the right (x, y: icon centres). High
  # in the window: Finder's bars can cover its bottom ~60 pt. Finder writes the icons'
  # names in black: the background draws them light instead (see contents).
  # Background (build/background@2x.png for Retina) and the disk's own icon: the floppy.
  background: build/background.png
  icon: build/dmg-icon.icns
  # Where it opens: macOS keeps a fixed position (it cannot centre on every screen); this
  # centres it on the usual MacBook screen (1470 × 956 pt), close to centre on the others.
  window:
    x: 465
    y: 288
    width: 540
    height: 380
  iconSize: 112
  iconTextSize: 10
  contents:
    - x: 140
      y: 140
    # No name under it: Finder writes names in black, so «Aplicaciones» is drawn in the
    # background, light. The app's own name can't be removed: the background is pure
    # black there (the glow ends above it), so black text does not show.
    - x: 400
      y: 140
      type: link
      path: /Applications
      name: " "
win:
  icon: build/icon-win.png
  target:
    - target: nsis
      arch: x64
  signAndEditExecutable: false
nsis:
  # The setup program's icon: the floppy.
  installerIcon: build/installer-icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
